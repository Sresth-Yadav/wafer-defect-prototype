<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WaferAI — Semiconductor Defect Intelligence</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    body { background: #070b14; color: #e2e8f0; font-family: Inter, system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(12px); border: 1px solid rgba(148, 163, 184, 0.14); }
    .glow-cyan { box-shadow: 0 0 28px rgba(34, 211, 238, 0.12); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
  </style>
</head>
<body class="min-h-screen antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function BarChartCanvas({ id, labels, datasets, options = {} }) {
      const canvasRef = useRef(null);
      const chartRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current) return;
        if (chartRef.current) chartRef.current.destroy();
        chartRef.current = new Chart(canvasRef.current, {
          type: "bar",
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { labels: { color: "#cbd5e1", font: { size: 11 } } },
            },
            scales: {
              x: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.08)" } },
              y: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.08)" }, beginAtZero: true },
            },
            ...options,
          },
        });
        return () => { if (chartRef.current) chartRef.current.destroy(); };
      }, [JSON.stringify(labels), JSON.stringify(datasets)]);

      return <canvas ref={canvasRef} id={id} />;
    }

    function SeverityBadge({ label }) {
      const styles = {
        Low: "bg-emerald-500/15 text-emerald-300 border-emerald-500/30",
        Medium: "bg-amber-500/15 text-amber-300 border-amber-500/30",
        High: "bg-rose-500/15 text-rose-300 border-rose-500/30",
      };
      return (
        <span className={`px-2.5 py-1 rounded-full text-xs font-semibold border ${styles[label] || "bg-slate-700 text-slate-300 border-slate-600"}`}>
          {label || "N/A"}
        </span>
      );
    }

    function App() {
      const [tab, setTab] = useState("inspect");
      const [metricsData, setMetricsData] = useState(null);
      const [metricsError, setMetricsError] = useState("");
      const [samples, setSamples] = useState([]);

      // Inspection state
      const [selectedFile, setSelectedFile] = useState(null);
      const [previewUrl, setPreviewUrl] = useState("");
      const [inspecting, setInspecting] = useState(false);
      const [inspectError, setInspectError] = useState("");
      const [result, setResult] = useState(null);
      const [history, setHistory] = useState([]);

      // Chat state
      const [messages, setMessages] = useState([
        {
          role: "assistant",
          content: "Hello! I'm your **WaferAI Inspection Assistant** (powered by Groq `openai/gpt-oss-120b`). Upload a wafer image in **Live Inspection** or ask me about semiconductor defects, Grad-CAM, severity scoring, or ResNet-18 vs. Vision Transformers.",
        },
      ]);
      const [chatInput, setChatInput] = useState("");
      const [chatLoading, setChatLoading] = useState(false);

      useEffect(() => {
        fetch("/api/metrics")
          .then((r) => (r.ok ? r.json() : Promise.reject("Metrics not generated yet")))
          .then((data) => setMetricsData(data))
          .catch((err) => setMetricsError(String(err)));

        fetch("/api/samples")
          .then((r) => (r.ok ? r.json() : { samples: [] }))
          .then((data) => setSamples(data.samples || []))
          .catch(() => {});
      }, []);

      const runSample = async (sampleName) => {
        try {
          const res = await fetch(`/api/samples/${encodeURIComponent(sampleName)}`);
          if (!res.ok) throw new Error("Could not load sample");
          const blob = await res.blob();
          const file = new File([blob], sampleName, { type: blob.type || "image/jpeg" });
          handleFileSelect(file);
        } catch (err) {
          setInspectError(err.message);
        }
      };

      const handleFileSelect = (file) => {
        if (!file) return;
        setSelectedFile(file);
        setPreviewUrl(URL.createObjectURL(file));
        setInspectError("");
        runInspection(file);
      };

      const runInspection = async (file) => {
        setInspecting(true);
        setInspectError("");
        const formData = new FormData();
        formData.append("file", file);

        try {
          const res = await fetch("/run", { method: "POST", body: formData });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Inspection failed");
          const out = data.output || data;
          setResult(out);
          setHistory((prev) => [
            {
              id: prev.length + 1,
              timestamp: new Date().toLocaleTimeString(),
              filename: file.name,
              label: out.inference?.label || "unknown",
              confidence: out.inference?.confidence || 0,
              severity: out.severity?.severity_label || "N/A",
              affectedPct: out.severity?.affected_area_pct || 0,
              raw: out,
            },
            ...prev,
          ]);
        } catch (err) {
          setInspectError(err.message);
        } finally {
          setInspecting(false);
        }
      };

      const sendChat = async (customPrompt) => {
        const q = (customPrompt || chatInput).trim();
        if (!q || chatLoading) return;
        if (!customPrompt) setChatInput("");

        setMessages((prev) => [...prev, { role: "user", content: q }]);
        setChatLoading(true);
        try {
          const res = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: q, payload: result || {} }),
          });
          const data = await res.json();
          if (!res.ok) throw new Error(data.detail || "Chat error");
          setMessages((prev) => [...prev, { role: "assistant", content: data.answer }]);
        } catch (err) {
          setMessages((prev) => [...prev, { role: "assistant", content: `Error: ${err.message}` }]);
        } finally {
          setChatLoading(false);
        }
      };

      const exportPdf = async () => {
        if (!result) return;
        try {
          const res = await fetch("/export-pdf", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...result, filename: selectedFile?.name || "wafer_image.png" }),
          });
          if (!res.ok) throw new Error("Failed to export PDF");
          const blob = await res.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "wafer_inspection_report.pdf";
          a.click();
        } catch (err) {
          alert("PDF Export Error: " + err.message);
        }
      };

      const quickPrompts = [
        "Explain the current wafer defect prediction & severity",
        "What is Grad-CAM and how should engineers interpret it?",
        "Why is rolled_pit harder to classify than silk_spot?",
        "Compare ResNet-18 vs Vision Transformers (ViT) for wafer inspection",
      ];

      return (
        <div className="min-h-screen flex flex-col">
          {/* Header */}
          <header className="border-b border-slate-800/80 bg-slate-950/80 backdrop-blur sticky top-0 z-30">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 py-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-400 to-indigo-600 flex items-center justify-center text-slate-950 font-black text-lg shadow-lg shadow-cyan-500/20">
                  W
                </div>
                <div>
                  <h1 className="text-lg font-bold tracking-tight text-white">WaferAI Inspection Suite</h1>
                  <p className="text-xs text-slate-400">LangGraph • MCP Architecture • ResNet-18 + Grad-CAM • Groq Llama 3.3 70B</p>
                </div>
              </div>

              <div className="flex items-center gap-2 text-xs">
                <span className="px-2.5 py-1 rounded-full bg-cyan-500/10 text-cyan-300 border border-cyan-500/25 font-medium">
                  Val Acc: {metricsData ? `${metricsData.model.overall_accuracy}%` : "94.88%"}
                </span>
                <span className="px-2.5 py-1 rounded-full bg-indigo-500/10 text-indigo-300 border border-indigo-500/25 font-medium">
                  5 Defect Classes
                </span>
              </div>
            </div>

            {/* Navigation Tabs */}
            <div className="max-w-7xl mx-auto px-4 sm:px-6 flex gap-1 overflow-x-auto">
              {[
                { id: "inspect", label: "🔬 Live Inspection" },
                { id: "eda", label: "📊 EDA & Model Metrics" },
                { id: "chat", label: "🤖 AI Assistant (Groq)" },
                { id: "history", label: `📋 History (${history.length})` },
              ].map((t) => (
                <button
                  key={t.id}
                  onClick={() => setTab(t.id)}
                  className={`px-4 py-2.5 text-sm font-medium border-b-2 transition whitespace-nowrap ${
                    tab === t.id
                      ? "border-cyan-400 text-cyan-300"
                      : "border-transparent text-slate-400 hover:text-slate-200"
                  }`}
                >
                  {t.label}
                </button>
              ))}
            </div>
          </header>

          {/* Main Content */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6">
            {/* TAB 1: LIVE INSPECTION */}
            {tab === "inspect" && (
              <div className="space-y-6">
                {/* Upload Dropzone */}
                <label className="glass glow-cyan rounded-2xl p-6 flex flex-col sm:flex-row items-center justify-between gap-4 cursor-pointer hover:border-cyan-400/50 transition">
                  <div>
                    <h2 className="text-base font-semibold text-white">Upload Semiconductor Wafer Image</h2>
                    <p className="text-xs text-slate-400 mt-1">
                      Supports PNG, JPG, JPEG, TIF. Runs LangGraph nodes: <code className="text-cyan-300">ingest → infer → explain → aggregate</code>.
                    </p>
                  </div>
                  <div className="px-4 py-2 rounded-xl bg-gradient-to-r from-cyan-500 to-indigo-600 text-white text-sm font-semibold shadow-md">
                    {inspecting ? "Analyzing..." : "Choose Wafer Image"}
                  </div>
                  <input
                    type="file"
                    accept="image/*"
                    className="hidden"
                    onChange={(e) => handleFileSelect(e.target.files[0])}
                  />
                </label>

                {samples.length > 0 && (
                  <div className="glass rounded-xl p-4 flex flex-wrap items-center gap-2">
                    <span className="text-xs font-semibold text-slate-400 mr-1">⚡ 1-Click Sample Wafers:</span>
                    {samples.map((s) => (
                      <button
                        key={s.name}
                        onClick={() => runSample(s.name)}
                        disabled={inspecting}
                        className="px-3 py-1.5 rounded-lg bg-slate-800/90 hover:bg-cyan-500/20 border border-slate-700 hover:border-cyan-400/40 text-xs text-slate-200 capitalize transition disabled:opacity-50"
                      >
                        {s.label}
                      </button>
                    ))}
                  </div>
                )}

                {inspectError && (
                  <div className="rounded-xl bg-rose-500/10 border border-rose-500/30 p-4 text-sm text-rose-300">
                    ❌ {inspectError}
                  </div>
                )}

                {result && (
                  <div className="space-y-6">
                    {/* KPI Row */}
                    <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Predicted Defect Class</div>
                        <div className="text-xl font-bold text-white mt-1 capitalize">{result.inference?.label}</div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Model Confidence</div>
                        <div className="text-xl font-bold text-cyan-300 mt-1">
                          {((result.inference?.confidence || 0) * 100).toFixed(2)}%
                        </div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Severity Level</div>
                        <div className="mt-2 flex items-center gap-2">
                          <SeverityBadge label={result.severity?.severity_label} />
                          <span className="text-xs text-slate-400">({result.severity?.severity_score})</span>
                        </div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Grad-CAM Affected Area</div>
                        <div className="text-xl font-bold text-amber-300 mt-1">
                          {result.severity?.affected_area_pct ?? 0}%
                        </div>
                      </div>
                    </div>

                    {/* Side-by-side Image & Grad-CAM */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="glass rounded-2xl p-4">
                        <div className="text-sm font-semibold text-slate-200 mb-3">Original Wafer Image ({selectedFile?.name})</div>
                        {previewUrl && (
                          <img src={previewUrl} alt="Original Wafer" className="w-full max-h-80 object-contain rounded-xl bg-slate-950" />
                        )}
                      </div>
                      <div className="glass rounded-2xl p-4">
                        <div className="flex items-center justify-between mb-3">
                          <span className="text-sm font-semibold text-slate-200">Grad-CAM Explainability Overlay</span>
                          <span className="text-xs text-cyan-300">layer4[1].conv2</span>
                        </div>
                        {result.gradcam_b64 && (
                          <img
                            src={`data:image/png;base64,${result.gradcam_b64}`}
                            alt="Grad-CAM Overlay"
                            className="w-full max-h-80 object-contain rounded-xl bg-slate-950"
                          />
                        )}
                      </div>
                    </div>

                    {/* Class Probabilities + Action */}
                    <div className="glass rounded-2xl p-5">
                      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
                        <div>
                          <h3 className="text-sm font-semibold text-white">Class Probability Distribution</h3>
                          {result.route_taken && (
                            <p className="text-xs text-slate-400 mt-1">
                              LangGraph Route: <code className="text-cyan-300">{result.route_taken.join(" → ")}</code>
                            </p>
                          )}
                        </div>
                        <div className="flex flex-wrap gap-2">
                          <button
                            onClick={exportPdf}
                            className="px-3.5 py-1.5 rounded-lg bg-emerald-500/15 hover:bg-emerald-500/25 border border-emerald-400/30 text-emerald-200 text-xs font-medium transition"
                          >
                            📄 Export PDF Report
                          </button>
                          <button
                            onClick={() => {
                              setTab("chat");
                              sendChat("Explain this wafer inspection result, its severity score, and what manufacturing process issue might cause this defect.");
                            }}
                            className="px-3.5 py-1.5 rounded-lg bg-indigo-500/20 hover:bg-indigo-500/30 border border-indigo-400/30 text-indigo-200 text-xs font-medium transition"
                          >
                            🤖 Ask Groq AI About This Result →
                          </button>
                        </div>
                      </div>

                      {result.needs_review && (
                        <div className="mb-4 rounded-xl bg-amber-500/10 border border-amber-500/30 p-3 text-xs text-amber-200">
                          ⚠️ <strong>Human Review Flagged:</strong> {result.review_reason}
                        </div>
                      )}

                      {result.diagnostic_report && (
                        <div className="mb-4 rounded-xl bg-slate-900/90 border border-cyan-500/25 p-3.5 text-xs text-slate-200 whitespace-pre-wrap leading-relaxed">
                          <div className="font-semibold text-cyan-300 mb-1">🩺 Automated Fab Diagnostic Agent</div>
                          {result.diagnostic_report}
                        </div>
                      )}
                      <div className="space-y-3">
                        {Object.entries(result.inference?.all_scores || {})
                          .sort((a, b) => b[1] - a[1])
                          .map(([cls, prob]) => (
                            <div key={cls}>
                              <div className="flex justify-between text-xs mb-1">
                                <span className="text-slate-300 font-medium">{cls}</span>
                                <span className="text-slate-400">{(prob * 100).toFixed(2)}%</span>
                              </div>
                              <div className="w-full h-2 rounded-full bg-slate-800 overflow-hidden">
                                <div
                                  className="h-full rounded-full bg-gradient-to-r from-cyan-400 to-indigo-500"
                                  style={{ width: `${Math.max(prob * 100, 1)}%` }}
                                />
                              </div>
                            </div>
                          ))}
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* TAB 2: EDA & MODEL METRICS */}
            {tab === "eda" && (
              <div className="space-y-6">
                {metricsError && (
                  <div className="glass rounded-xl p-4 text-amber-300 text-sm">
                    ⚠️ {metricsError}. Run <code className="text-white">python scripts/evaluate.py</code> to generate metrics.
                  </div>
                )}

                {metricsData && (
                  <>
                    {/* Summary KPIs */}
                    <div className="grid grid-cols-2 md:grid-cols-5 gap-4">
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Overall Accuracy</div>
                        <div className="text-2xl font-bold text-emerald-400 mt-1">{metricsData.model.overall_accuracy}%</div>
                        <div className="text-[11px] text-slate-500">{metricsData.model.correct}/{metricsData.model.total_val} val samples</div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Macro F1-Score</div>
                        <div className="text-2xl font-bold text-cyan-300 mt-1">{metricsData.model.macro_avg.f1_score}</div>
                        <div className="text-[11px] text-slate-500">Balanced across 5 classes</div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Weighted F1-Score</div>
                        <div className="text-2xl font-bold text-indigo-300 mt-1">{metricsData.model.weighted_avg.f1_score}</div>
                        <div className="text-[11px] text-slate-500">Support-weighted</div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Dataset Size</div>
                        <div className="text-2xl font-bold text-white mt-1">{metricsData.eda.total_images}</div>
                        <div className="text-[11px] text-slate-500">Train {metricsData.model.train_samples} / Val {metricsData.model.val_samples}</div>
                      </div>
                      <div className="glass rounded-xl p-4">
                        <div className="text-xs text-slate-400">Mean Resolution</div>
                        <div className="text-lg font-bold text-white mt-1">
                          {Math.round(metricsData.eda.image_dimensions.width_mean)}×{Math.round(metricsData.eda.image_dimensions.height_mean)}
                        </div>
                        <div className="text-[11px] text-slate-500">Avg {metricsData.eda.image_dimensions.avg_file_size_kb} KB</div>
                      </div>
                    </div>

                    {/* Charts Row */}
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                      <div className="glass rounded-2xl p-5">
                        <h3 className="text-sm font-semibold text-white mb-4">Dataset EDA — Class Distribution (Imbalance Analysis)</h3>
                        <div className="h-64">
                          <BarChartCanvas
                            id="eda-class-chart"
                            labels={metricsData.eda.class_distribution.map((c) => c.class_name)}
                            datasets={[
                              {
                                label: "Image Count",
                                data: metricsData.eda.class_distribution.map((c) => c.count),
                                backgroundColor: ["#22d3ee", "#818cf8", "#f43f5e", "#34d399", "#fbbf24"],
                                borderRadius: 6,
                              },
                            ]}
                          />
                        </div>
                      </div>

                      <div className="glass rounded-2xl p-5">
                        <h3 className="text-sm font-semibold text-white mb-4">Model Performance — Precision, Recall & F1 by Class</h3>
                        <div className="h-64">
                          <BarChartCanvas
                            id="perf-class-chart"
                            labels={metricsData.model.per_class.map((c) => c.class_name)}
                            datasets={[
                              {
                                label: "Precision",
                                data: metricsData.model.per_class.map((c) => c.precision),
                                backgroundColor: "rgba(34, 211, 238, 0.75)",
                                borderRadius: 4,
                              },
                              {
                                label: "Recall",
                                data: metricsData.model.per_class.map((c) => c.recall),
                                backgroundColor: "rgba(129, 140, 248, 0.75)",
                                borderRadius: 4,
                              },
                              {
                                label: "F1-Score",
                                data: metricsData.model.per_class.map((c) => c.f1_score),
                                backgroundColor: "rgba(52, 211, 153, 0.75)",
                                borderRadius: 4,
                              },
                            ]}
                            options={{ scales: { y: { max: 1.05, beginAtZero: true, ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.08)" } }, x: { ticks: { color: "#94a3b8" }, grid: { color: "rgba(148,163,184,0.08)" } } } }}
                          />
                        </div>
                      </div>
                    </div>

                    {/* Confusion Matrix & Image Dimension Stats */}
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                      <div className="glass rounded-2xl p-5 lg:col-span-2 overflow-x-auto">
                        <h3 className="text-sm font-semibold text-white mb-3">Validation Confusion Matrix (Rows = True, Cols = Predicted)</h3>
                        <table className="w-full text-xs text-center border-collapse">
                          <thead>
                            <tr>
                              <th className="p-2 text-left text-slate-400">True \ Pred</th>
                              {metricsData.model.class_names.map((c) => (
                                <th key={c} className="p-2 text-slate-300 font-semibold">{c}</th>
                              ))}
                            </tr>
                          </thead>
                          <tbody>
                            {metricsData.model.confusion_matrix.map((row, rIdx) => (
                              <tr key={rIdx} className="border-t border-slate-800">
                                <td className="p-2 text-left font-semibold text-slate-300">{metricsData.model.class_names[rIdx]}</td>
                                {row.map((val, cIdx) => (
                                  <td
                                    key={cIdx}
                                    className={`p-2 font-mono rounded ${
                                      rIdx === cIdx
                                        ? "bg-emerald-500/20 text-emerald-300 font-bold"
                                        : val > 0
                                        ? "bg-rose-500/15 text-rose-300"
                                        : "text-slate-500"
                                    }`}
                                  >
                                    {val}
                                  </td>
                                ))}
                              </tr>
                            ))}
                          </tbody>
                        </table>
                      </div>

                      <div className="glass rounded-2xl p-5 space-y-3 text-xs">
                        <h3 className="text-sm font-semibold text-white">EDA Image Metadata</h3>
                        <div className="flex justify-between py-1.5 border-b border-slate-800">
                          <span className="text-slate-400">Architecture</span>
                          <span className="text-slate-200 font-medium">{metricsData.model.architecture}</span>
                        </div>
                        <div className="flex justify-between py-1.5 border-b border-slate-800">
                          <span className="text-slate-400">Width Range</span>
                          <span className="text-slate-200">{metricsData.eda.image_dimensions.width_min} – {metricsData.eda.image_dimensions.width_max} px</span>
                        </div>
                        <div className="flex justify-between py-1.5 border-b border-slate-800">
                          <span className="text-slate-400">Height Range</span>
                          <span className="text-slate-200">{metricsData.eda.image_dimensions.height_min} – {metricsData.eda.image_dimensions.height_max} px</span>
                        </div>
                        <div className="flex justify-between py-1.5 border-b border-slate-800">
                          <span className="text-slate-400">Mean Aspect Ratio</span>
                          <span className="text-slate-200">{metricsData.eda.image_dimensions.aspect_ratio_mean}</span>
                        </div>
                        <div className="flex justify-between py-1.5">
                          <span className="text-slate-400">File Formats</span>
                          <span className="text-slate-200">{JSON.stringify(metricsData.eda.file_formats)}</span>
                        </div>
                      </div>
                    </div>
                  </>
                )}
              </div>
            )}

            {/* TAB 3: GROQ CHATBOT */}
            {tab === "chat" && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="glass rounded-2xl p-4 lg:col-span-2 flex flex-col h-[580px]">
                  <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                    <div>
                      <h2 className="text-sm font-semibold text-white">Groq Semiconductor AI Assistant</h2>
                      <p className="text-xs text-slate-400">Model: <code className="text-cyan-300">openai/gpt-oss-120b</code></p>
                    </div>
                    {result && (
                      <span className="px-2.5 py-1 rounded-full bg-emerald-500/15 text-emerald-300 text-xs border border-emerald-500/30">
                        Context: {result.inference?.label} ({((result.inference?.confidence || 0) * 100).toFixed(1)}%)
                      </span>
                    )}
                  </div>

                  <div className="flex-1 overflow-y-auto py-4 space-y-3 pr-2">
                    {messages.map((m, i) => (
                      <div key={i} className={`flex ${m.role === "user" ? "justify-end" : "justify-start"}`}>
                        <div
                          className={`max-w-[82%] rounded-2xl px-4 py-3 text-sm whitespace-pre-wrap leading-relaxed ${
                            m.role === "user"
                              ? "bg-gradient-to-r from-cyan-600 to-indigo-600 text-white"
                              : "bg-slate-800/90 text-slate-200 border border-slate-700/60"
                          }`}
                        >
                          {m.content}
                        </div>
                      </div>
                    ))}
                    {chatLoading && (
                      <div className="text-xs text-cyan-300 animate-pulse">Thinking with Groq Llama 3.3 70B...</div>
                    )}
                  </div>

                  <form
                    onSubmit={(e) => { e.preventDefault(); sendChat(); }}
                    className="pt-3 border-t border-slate-800 flex gap-2"
                  >
                    <input
                      value={chatInput}
                      onChange={(e) => setChatInput(e.target.value)}
                      placeholder="Ask about this wafer defect, Grad-CAM, severity, or vision encoders..."
                      className="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-cyan-400"
                    />
                    <button
                      type="submit"
                      disabled={chatLoading}
                      className="px-5 py-2.5 rounded-xl bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-semibold text-sm transition disabled:opacity-50"
                    >
                      Send
                    </button>
                  </form>
                </div>

                <div className="glass rounded-2xl p-4 space-y-3 h-fit">
                  <h3 className="text-sm font-semibold text-white">Suggested Questions</h3>
                  <p className="text-xs text-slate-400">Click any prompt to ask the assistant immediately:</p>
                  <div className="space-y-2">
                    {quickPrompts.map((p, idx) => (
                      <button
                        key={idx}
                        onClick={() => sendChat(p)}
                        className="w-full text-left p-3 rounded-xl bg-slate-900/80 hover:bg-slate-800 border border-slate-800 hover:border-cyan-500/40 text-xs text-slate-300 transition"
                      >
                        {p}
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: HISTORY */}
            {tab === "history" && (
              <div className="glass rounded-2xl p-5">
                <div className="flex items-center justify-between mb-4">
                  <h2 className="text-sm font-semibold text-white">Session Inspection History</h2>
                  {history.length > 0 && (
                    <button
                      onClick={() => {
                        const blob = new Blob([JSON.stringify(history, null, 2)], { type: "application/json" });
                        const url = URL.createObjectURL(blob);
                        const a = document.createElement("a");
                        a.href = url;
                        a.download = "wafer_inspection_history.json";
                        a.click();
                      }}
                      className="px-3 py-1.5 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-xs font-medium"
                    >
                      ⬇ Export JSON Report
                    </button>
                  )}
                </div>

                {history.length === 0 ? (
                  <p className="text-sm text-slate-400">No wafers inspected yet in this session.</p>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-sm text-left">
                      <thead className="text-xs text-slate-400 border-b border-slate-800">
                        <tr>
                          <th className="py-2 pr-4">#</th>
                          <th className="py-2 pr-4">Time</th>
                          <th className="py-2 pr-4">File</th>
                          <th className="py-2 pr-4">Predicted Class</th>
                          <th className="py-2 pr-4">Confidence</th>
                          <th className="py-2 pr-4">Severity</th>
                          <th className="py-2">Affected Area</th>
                        </tr>
                      </thead>
                      <tbody>
                        {history.map((h) => (
                          <tr key={h.id} className="border-b border-slate-800/60">
                            <td className="py-2.5 pr-4 text-slate-400">{h.id}</td>
                            <td className="py-2.5 pr-4 text-slate-400 text-xs">{h.timestamp}</td>
                            <td className="py-2.5 pr-4 text-slate-200 font-medium">{h.filename}</td>
                            <td className="py-2.5 pr-4 text-cyan-300 font-semibold capitalize">{h.label}</td>
                            <td className="py-2.5 pr-4 text-slate-200">{(h.confidence * 100).toFixed(2)}%</td>
                            <td className="py-2.5 pr-4"><SeverityBadge label={h.severity} /></td>
                            <td className="py-2.5 text-amber-300">{h.affectedPct}%</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
