name: wafer-defect-prototype

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint with ruff
        run: ruff check .

      - name: Run unit tests
        run: pytest -q

      - name: Build Docker image
        run: |
          docker build -t wafer-defect-prototype:latest .